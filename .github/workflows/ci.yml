name: CI

on:
  # Every branch, not only main: work arrives as feature branches and the gates
  # are worth having only if they run before a merge is proposed.
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  provenance:
    name: All content is original
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/check_provenance.py

  test:
    name: Tests and architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  mutation:
    name: Mutation score on Bridgeon.Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet tool restore
      # Line coverage says a line ran. Mutation score says a test would notice if
      # it changed. For a scoring engine only the second is worth having.
      - name: Stryker (breaks below 90%)
        working-directory: tests/Bridgeon.Core.Tests
        run: dotnet dotnet-stryker --config-file ../../stryker-config.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: '**/StrykerOutput/**/reports/*.html'

  commit-order:
    name: A test commit precedes every feat commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./tools/check_commit_order.sh origin/main
